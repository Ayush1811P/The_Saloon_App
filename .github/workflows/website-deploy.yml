name: Website CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Validate production output
        run: test -s dist/index.html

      - name: Report deployment mode
        run: |
          echo "Website build completed."
          echo "No Netlify or Vercel deployment configuration is present in this repository."
          echo "Configure hosting through the provider's Git integration or add provider credentials before enabling deployment."
